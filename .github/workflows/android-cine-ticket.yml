name: CinéPass Android

on:
  push:
    paths:
      - 'android-cine-ticket/**'
      - '.github/workflows/android-cine-ticket.yml'
  pull_request:
    paths:
      - 'android-cine-ticket/**'
      - '.github/workflows/android-cine-ticket.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests unitaires + APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-cine-ticket

    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construire l'APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: cinepass-debug-apk
          path: android-cine-ticket/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier les rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cinepass-test-reports
          path: android-cine-ticket/app/build/reports/
          if-no-files-found: ignore
